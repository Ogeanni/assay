# fly.toml app configuration file generated for assay-hub-api on 2026-05-11T23:53:13+01:00

app = 'assay-hub-api'
primary_region = 'lhr'

[build]

[env]
  ENVIRONMENT = "production"

[processes]
  app = "uvicorn apps.api.main:app --host 0.0.0.0 --port 8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1