<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" width="200" height="80">
  <title>ASSAY Logo</title>
  <!-- Diamond mark -->
  <g transform="translate(8, 4)">
    <!-- Outer diamond -->
    <polygon points="36,0 72,36 36,72 0,36" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
    <!-- Inner diamond -->
    <polygon points="36,14 58,36 36,58 14,36" fill="#7c3aed" fill-opacity="0.25"/>
    <polygon points="36,14 58,36 36,58 14,36" fill="none" stroke="#a78bfa" stroke-width="1.5"/>
    <!-- Center dot -->
    <circle cx="36" cy="36" r="6" fill="#a78bfa"/>
    <!-- Tick marks -->
    <line x1="36" y1="0" x2="36" y2="11" stroke="#7c3aed" stroke-width="1.5" stroke-opacity="0.6"/>
    <line x1="36" y1="61" x2="36" y2="72" stroke="#7c3aed" stroke-width="1.5" stroke-opacity="0.6"/>
    <line x1="0" y1="36" x2="11" y2="36" stroke="#7c3aed" stroke-width="1.5" stroke-opacity="0.6"/>
    <line x1="61" y1="36" x2="72" y2="36" stroke="#7c3aed" stroke-width="1.5" stroke-opacity="0.6"/>
  </g>
  <!-- Wordmark -->
  <text x="92" y="46" font-family="Georgia, serif" font-size="28" font-weight="700" fill="white" letter-spacing="4">ASSAY</text>
</svg>
